<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101419">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="HitBlow">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hit & Blow Match</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <link rel="manifest" href="/site.webmanifest?v=10">
    <link rel="stylesheet" href="/styles.css?v=10">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <img src="/assets/mark.svg" alt="" class="mark" width="44" height="44">
        <div>
          <p class="eyebrow">Keyword Match</p>
          <h1>Hit & Blow</h1>
        </div>
        <div id="connection" class="connection" aria-live="polite">接続中</div>
      </header>
      <section id="app" class="app" aria-live="polite"></section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js?v=10" defer></script>
  </body>
</html>
